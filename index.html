<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isidro González — Videógrafo</title>
<meta name="description" content="Isidro González, videógrafo y director de fotografía. Portfolio de trabajos audiovisuales.">
<meta name="theme-color" content="#fffbf4">

<!-- Imagen y textos al compartir el enlace (WhatsApp, Instagram, X…).
     La imagen se genera a mano en posters/compartir.jpg; si se cambia,
     tiene que seguir midiendo 1200x630 y la URL ser absoluta: las redes
     no resuelven rutas relativas. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Isidro González">
<meta property="og:locale" content="es_ES">
<meta property="og:url" content="https://isidrogonzalez.vercel.app/">
<meta property="og:title" content="Isidro González — Videógrafo">
<meta property="og:description" content="Portfolio de trabajos audiovisuales.">
<meta property="og:image" content="https://isidrogonzalez.vercel.app/posters/compartir.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Isidro González — Videógrafo y director de fotografía">
<meta name="twitter:card" content="summary_large_image">



<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <h1 class="sr-only">Isidro González — Videógrafo y director de fotografía</h1>

  <!-- Escena del bucle infinito -->
  <main class="escena">
    <div class="pista"></div>
  </main>

  <!-- Volver a todos los proyectos (sólo visible dentro de una categoría) -->
  <nav class="ui-superior" style="display:none">
    <a class="pill" href="#">← Todos los proyectos</a>
  </nav>

  <div class="desvanecido-inferior" aria-hidden="true"></div>

  <!-- Filtros -->
  <nav class="ui-inferior">
    <div class="filtros" aria-label="Filtrar por categoría"></div>
    <button class="pill boton-filtro" aria-label="Abrir filtros">
      <span class="txt-abrir">Filtrar</span>
      <span class="txt-cerrar">✕</span>
    </button>
  </nav>

  <!-- Reproductor -->
  <div class="visor" role="dialog" aria-modal="true" aria-label="Reproductor de vídeo">
    <video controls playsinline></video>
    <div class="estado carga">
      <div class="giro"></div>
      <p class="type-small">Cargando vídeo…</p>
    </div>
    <div class="estado error">
      <p class="type-large">No se ha podido reproducir este vídeo.</p>
      <p class="type-small detalle"></p>
    </div>
    <button class="cerrar pill" aria-label="Cerrar">✕ Cerrar</button>
    <p class="pie type-small"></p>
  </div>

  <div class="cortina"></div>

  <noscript>
    <p style="padding:6vw">Este portfolio necesita JavaScript activado.
    Puedes escribir a <a href="mailto:Isiglez01@gmail.com">Isiglez01@gmail.com</a>.</p>
  </noscript>

  <script src="js/config.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/depurar.js"></script>
  <script src="js/rejilla.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
